<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>猪猪勇闯神庙 · Piggy Temple Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"] { min-height: 2.75rem; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root{
        --ink:#33301f;
        --ink-soft:#7d7458;
        --paper:#f6efdb;
        --panel:#fffdf4;
        --line:#e0d0a2;
        --pink:#ff8fb5;
        --pink-deep:#f2608f;
        --jungle:#4c9440;
        --jungle-deep:#2f6b2f;
        --stone:#8a7c5c;
        --stone-dark:#5d5138;
        --danger:#e14b4b;
        --gold:#e8a812;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --ink:#f2e8d5;
          --ink-soft:#cbbd9d;
          --paper:#241f16;
          --panel:#33291d;
          --line:#5d4f33;
          --jungle:#356b35;
          --jungle-deep:#224d24;
          color-scheme: dark;
        }
      }
      html,body{ margin:0; padding:0; }
      body{
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
        color:var(--ink);
        background:
          radial-gradient(120px 46px at 12% 6%, rgba(255,255,255,.8) 60%, transparent 61%),
          radial-gradient(160px 58px at 84% 4%, rgba(255,255,255,.75) 60%, transparent 61%),
          linear-gradient(180deg, #bfe3f7 0%, #dff3d8 30%, var(--jungle) 76%, var(--jungle-deep) 100%);
        min-height:100vh;
        overflow-x:clip;
      }
      @media (prefers-color-scheme: dark){
        body{ background:linear-gradient(180deg,#1d3247 0%, #274a38 55%, #1e4630 100%); }
      }
      .app{ max-width:480px; margin:0 auto; padding:14px 14px 28px; }

      /* ---------- header ---------- */
      header.top{ display:flex; align-items:center; gap:10px; }
      .mascot{ width:56px; height:56px; flex:0 0 auto; filter:drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
      .title-wrap{ flex:1; min-width:0; }
      .lang-toggle{
        flex:0 0 auto; display:flex; background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:3px; gap:2px; box-shadow:0 2px 0 rgba(0,0,0,.08);
      }
      .lang-toggle button{
        border:none; background:transparent; color:var(--ink-soft); font-weight:800; font-size:12.5px; padding:5px 10px; border-radius:999px; cursor:pointer; min-height:2rem; font-family:inherit; line-height:1;
      }
      .lang-toggle button.active{ background:var(--jungle-deep); color:#fff; }
      h1{
        font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;
        font-size:26px; line-height:1.1; margin:0; letter-spacing:1px; white-space:nowrap;
        color:var(--jungle-deep);
        text-shadow:0 2px 0 #fff, 0 4px 0 rgba(47,107,47,.25);
      }
      @media (prefers-color-scheme: dark){ h1{ color:#a5d6a0; text-shadow:0 2px 0 rgba(0,0,0,.35); } }
      .subtitle{ margin:3px 0 0; font-size:12.5px; color:var(--ink-soft); }

      /* ---------- stats ---------- */
      .stats{
        margin-top:12px; background:var(--panel); border:2px solid var(--line); border-radius:14px;
        padding:9px 12px; display:flex; align-items:center; gap:10px; font-size:13px;
      }
      .stats b{ font-size:15px; white-space:nowrap; }
      .progress{ flex:1; height:10px; border-radius:99px; background:rgba(0,0,0,.08); overflow:hidden; min-width:40px; }
      .progress > i{ display:block; height:100%; width:0%; border-radius:99px;
        background:linear-gradient(90deg,var(--gold),var(--jungle)); transition:width .2s linear; }

      /* ---------- stage (runner canvas) ---------- */
      .stage-wrap{
        position:relative; margin-top:12px; border-radius:18px; overflow:hidden;
        border:3px solid var(--stone-dark);
        box-shadow:0 10px 24px rgba(30,60,25,.3), inset 0 0 0 2px rgba(255,255,255,.15);
        background:#9fd3e8;
        touch-action:none;
        user-select:none; -webkit-user-select:none;
      }
      .stage-wrap.shake{ animation:stageShake .4s ease; }
      @keyframes stageShake{ 15%{transform:translateX(-7px);} 35%{transform:translateX(6px);} 55%{transform:translateX(-4px);} 75%{transform:translateX(3px);} 100%{transform:translateX(0);} }
      canvas#gameCanvas{ display:block; width:100%; aspect-ratio:10/11; }
      .pause-btn{
        position:absolute; top:8px; right:8px; z-index:20;
        width:40px; min-height:40px; height:40px; border-radius:50%;
        border:2px solid rgba(255,255,255,.7); background:rgba(40,32,14,.55); color:#fff;
        font-size:16px; cursor:pointer; line-height:1; padding:0;
      }
      .toast{
        position:absolute; left:50%; top:14px; transform:translate(-50%,-8px);
        background:rgba(40,32,14,.88); color:#ffe9b8; font-size:13.5px; font-weight:700;
        padding:8px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s ease; z-index:30;
        white-space:nowrap; max-width:92%;
      }
      .toast.show{ opacity:1; transform:translate(-50%,0); }
      .ctrl-tip{ margin:8px 2px 0; font-size:12.5px; color:var(--ink-soft); min-height:18px; }
      .ctrl-tip b{ color:var(--jungle-deep); }
      @media (prefers-color-scheme: dark){ .ctrl-tip b{ color:#a5d6a0; } }

      /* ---------- run controls ---------- */
      .controls{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
      .ctl{
        border:2px solid var(--line); background:var(--panel); border-radius:14px; cursor:pointer;
        padding:8px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:1px;
        color:var(--ink); font-family:inherit;
        box-shadow:0 3px 0 rgba(0,0,0,.12);
        touch-action:manipulation; user-select:none; -webkit-user-select:none;
      }
      .ctl:active{ transform:translateY(2px); box-shadow:none; background:#fdf3d0; }
      .ctl .c-ico{ font-size:21px; line-height:1.15; }
      .ctl .c-name{ font-size:13px; font-weight:800; }

      .howto{ margin-top:14px; font-size:12.5px; line-height:1.65; color:var(--ink-soft);
        background:rgba(255,255,255,.45); border-radius:12px; padding:9px 12px; }
      @media (prefers-color-scheme: dark){ .howto{ background:rgba(0,0,0,.22); } }
      .howto b{ color:var(--ink); }

      /* ---------- alert & lives ---------- */
      .alert-bar{
        background:#ffe9a8; color:#6b4e00; border:2px solid #f2cf6b; border-radius:10px;
        padding:8px 10px; font-size:12.5px; font-weight:700; text-align:center; line-height:1.5; margin-bottom:12px;
      }
      @media (prefers-color-scheme: dark){ .alert-bar{ background:#4a3a10; color:#ffe1a1; border-color:#8a6d1f; } }
      .lives-bar{
        margin-top:10px; background:var(--panel); border:2px solid var(--line); border-radius:14px;
        padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px;
      }
      .lives-bar .lb-label{ font-weight:800; white-space:nowrap; }
      .lb-hearts{ font-size:13px; letter-spacing:1px; flex:1; min-width:120px; }
      .lb-num{ font-weight:800; white-space:nowrap; }
      .lb-add{
        border:2px solid var(--jungle-deep); background:var(--jungle); color:#fff; font-weight:800;
        border-radius:999px; padding:5px 14px; font-size:13px; cursor:pointer; min-height:2.2rem; font-family:inherit;
      }

      /* ---------- gate panels ---------- */
      .gate-lives{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; font-size:15px; flex-wrap:wrap; }
      .gate-lives-num b{ font-size:17px; color:var(--jungle-deep); }
      .lock-note{ display:none; color:var(--danger); font-weight:800; font-size:13.5px; }
      .panel{ border:2px solid var(--line); border-radius:14px; padding:12px; margin-top:14px; text-align:left; }
      .panel-title{ font-weight:800; font-size:14.5px; margin-bottom:4px; }
      .panel p{ font-size:13px; margin:6px 0; }
      .panel-note{ font-size:12px !important; color:var(--ink-soft); line-height:1.55; }
      .code-chip{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:rgba(0,0,0,.07); padding:2px 9px; border-radius:7px; font-weight:800; letter-spacing:1px; font-size:14px; }
      @media (prefers-color-scheme: dark){ .code-chip{ background:rgba(255,255,255,.12); } }
      .link-text{ font-size:12px; word-break:break-all; color:var(--jungle-deep); font-weight:700; }
      @media (prefers-color-scheme: dark){ .link-text{ color:#a5d6a0; } }
      .btn.sm{ padding:9px; font-size:14px; margin-top:8px; }
      a.btn{ text-decoration:none; }
      .bn-btn{ background:#f0b90b; color:#1e2329; box-shadow:0 4px 0 #c99400; }
      .bn-btn:active{ box-shadow:0 1px 0 #c99400; }
      .input-row{ display:flex; gap:6px; margin-top:10px; }
      .txt-input{
        flex:1; min-width:0; padding:10px; border:2px solid var(--line); border-radius:10px;
        font-size:16px; font-family:inherit; background:var(--panel); color:var(--ink);
      }
      .mini-btn{
        border:none; background:var(--jungle-deep); color:#fff; font-weight:800; font-size:13.5px;
        border-radius:10px; padding:0 14px; cursor:pointer; white-space:nowrap; font-family:inherit;
      }
      .msg{ min-height:20px; font-size:13px; font-weight:700; color:var(--danger); margin:8px 0 0 !important; }
      .msg.ok{ color:var(--jungle-deep); }
      .redeem-box{ text-align:left; border:2px dashed var(--gold); border-radius:14px; padding:10px 12px; margin:10px 0; }
      .redeem-box .txt-input{ width:100%; margin-top:8px; }
      .safe-tip{
        background:#e7f6e3; border:2px solid #bfe3b6; color:#2e5f2a; border-radius:12px;
        padding:10px 12px; font-size:12.5px; line-height:1.65; text-align:left; margin-top:12px;
      }
      @media (prefers-color-scheme: dark){ .safe-tip{ background:#22402a; border-color:#3f7d4e; color:#cdeac8; } }

      /* ---------- points & level map ---------- */
      .points-bar{
        margin-top:10px; background:var(--panel); border:2px solid var(--gold); border-radius:14px;
        padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px;
      }
      .pb-num{ font-weight:800; font-size:16px; color:#b97e00; white-space:nowrap; }
      @media (prefers-color-scheme: dark){ .pb-num{ color:var(--gold); } }
      .points-bar .progress{ flex:1; min-width:80px; }
      .pb-usdt{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
      .lb-add.gold{ border-color:#c99400; background:#f0b90b; color:#1e2329; }
      .level-map{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; }
      .lv-btn{
        border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px;
        padding:6px 2px 5px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column;
        align-items:center; gap:0; box-shadow:0 2px 0 rgba(0,0,0,.07); min-height:3rem;
      }
      .lv-btn .lv-n{ font-size:15px; font-weight:800; line-height:1.15; }
      .lv-btn .lv-s{ font-size:10.5px; color:var(--ink-soft); line-height:1.2; }
      .lv-btn.cleared{ background:#e7f6e3; border-color:#8ed081; }
      .lv-btn.cleared .lv-s{ color:var(--jungle-deep); font-weight:700; }
      @media (prefers-color-scheme: dark){ .lv-btn.cleared{ background:#22402a; border-color:#3f7d4e; } }
      .lv-btn.current{ border-color:var(--jungle-deep); box-shadow:0 0 0 2px rgba(47,107,47,.35); }
      .lv-btn:active{ transform:translateY(2px); box-shadow:none; }
      .task-steps{ margin:8px 0 2px; padding-left:20px; font-size:13px; line-height:1.9; }
      .win-points{
        background:#fff6d9; border:2px solid var(--gold); border-radius:12px; padding:9px 12px;
        font-size:14px; line-height:1.65; margin-top:10px; color:var(--ink);
      }
      @media (prefers-color-scheme: dark){ .win-points{ background:#4a3a10; } }

      /* ---------- overlay / modal ---------- */
      .overlay{
        position:fixed; inset:0; background:rgba(30,26,12,.55); backdrop-filter:blur(3px);
        display:none; align-items:center; justify-content:center; z-index:300; padding:18px;
      }
      .overlay.show{ display:flex; }
      .card{
        background:var(--panel); border:3px solid var(--line); border-radius:22px; max-width:360px; width:100%;
        padding:24px 22px 20px; text-align:center; box-shadow:0 18px 40px rgba(0,0,0,.3);
        animation:cardIn .3s cubic-bezier(.2,1.4,.4,1);
        max-height:calc(100dvh - 36px); overflow-y:auto; margin:auto;
      }
      @keyframes cardIn{ from{ transform:scale(.8); opacity:0;} to{ transform:scale(1); opacity:1;} }
      .card .big-emoji{ font-size:56px; line-height:1.1; }
      .card h2{ font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif; margin:6px 0 4px; font-size:26px; letter-spacing:1px; }
      .card p{ margin:6px 0; font-size:14px; line-height:1.6; color:var(--ink-soft); }
      .card .rules{ text-align:left; font-size:13.5px; line-height:1.9; color:var(--ink); margin:10px auto 4px; max-width:290px; }
      .btn{
        display:block; width:100%; margin-top:10px; border:none; cursor:pointer; font-family:inherit;
        background:var(--jungle-deep); color:#fff; font-size:16px; font-weight:800; letter-spacing:1px;
        border-radius:999px; padding:12px; box-shadow:0 4px 0 #1e4d1e;
      }
      .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #1e4d1e; }
      .btn.secondary{ background:var(--panel); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.12); }
      .btn:disabled{ opacity:.45; box-shadow:none; }
      .confetti{ position:fixed; top:-4vh; z-index:400; pointer-events:none; animation:fall linear forwards; }
      @keyframes fall{ to{ transform:translateY(112vh) rotate(560deg); } }
      @media (prefers-reduced-motion: reduce){
        .progress > i{ transition:none !important; }
        .confetti{ animation:none !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="alert-bar" role="note" id="alertBar">💾 血条已保存在本机浏览器：刷新、关页、返回都不会重置；清除浏览器数据或换设备才会重新开始</div>
      <header class="top">
        <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="22" cy="24" rx="13" ry="16" fill="#ffb7cd" transform="rotate(-24 22 24)"/>
          <ellipse cx="78" cy="24" rx="13" ry="16" fill="#ffb7cd" transform="rotate(24 78 24)"/>
          <ellipse cx="22" cy="24" rx="7" ry="10" fill="#f2608f" transform="rotate(-24 22 24)"/>
          <ellipse cx="78" cy="24" rx="7" ry="10" fill="#f2608f" transform="rotate(24 78 24)"/>
          <circle cx="50" cy="56" r="38" fill="#ffd3e2"/>
          <ellipse cx="50" cy="64" rx="17" ry="12.5" fill="#ffb7cd" stroke="#f2608f" stroke-width="2.5"/>
          <circle cx="44" cy="64" r="3.2" fill="#c2436e"/>
          <circle cx="56" cy="64" r="3.2" fill="#c2436e"/>
          <circle cx="35" cy="46" r="4.4" fill="#3d2b23"/>
          <circle cx="65" cy="46" r="4.4" fill="#3d2b23"/>
          <circle cx="36.6" cy="44.4" r="1.5" fill="#fff"/>
          <circle cx="66.6" cy="44.4" r="1.5" fill="#fff"/>
          <circle cx="28" cy="58" r="5.5" fill="#ff9ebb" opacity=".7"/>
          <circle cx="72" cy="58" r="5.5" fill="#ff9ebb" opacity=".7"/>
        </svg>
        <div class="title-wrap">
          <h1 id="mainTitle">猪猪勇闯神庙</h1>
          <p class="subtitle" id="mainSubtitle">神庙跑酷 · 15 关闯关 · 每关首通 +10,000 积分 · 100,000 分兑 5 USDT</p>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language / 语言">
          <button type="button" id="langZh">中文</button>
          <button type="button" id="langEn">EN</button>
        </div>
      </header>

      <div class="stats">
        <span><span id="labelDist">距离</span> <b id="statDist">0 米</b></span>
        <span>🪙 <b id="statCoins">0</b></span>
        <div class="progress" aria-hidden="true"><i id="progFill"></i></div>
        <span><span id="labelTarget">目标</span> <b id="statTarget">300 米</b></span>
      </div>

      <div class="lives-bar">
        <span class="lb-label" id="labelLives">❤️ 血条</span>
        <span class="lb-hearts" id="livesHearts"></span>
        <span class="lb-num" id="livesNum">3 / 10</span>
        <button class="lb-add" id="btnAddLives" type="button">＋ 加血</button>
      </div>

      <div class="points-bar">
        <span class="lb-label" id="labelPoints">⭐ 积分</span>
        <span class="pb-num" id="pointsNum">0</span>
        <div class="progress" aria-hidden="true"><i id="pointsFill"></i></div>
        <span class="pb-usdt" id="pointsUsdt">距兑换 5 USDT 还差 100,000 分</span>
        <button class="lb-add gold" id="btnClaim" type="button">🏆 兑换 USDT</button>
      </div>

      <div class="level-map" id="levelMap" role="group" aria-label="关卡地图（共 15 关）"></div>

      <div class="stage-wrap" id="stageWrap">
        <canvas id="gameCanvas" aria-label="神庙跑酷赛道"></canvas>
        <button class="pause-btn" id="btnPause" type="button" aria-label="暂停 / 继续">⏸</button>
        <div class="toast" id="toast"></div>
      </div>
      <p class="ctrl-tip" id="ctrlTip">在赛道上<b>左右滑动</b>换道、<b>上滑</b>跳跃、<b>下滑</b>滑铲，也可以点下方按钮或用键盘方向键。</p>

      <div class="controls">
        <button class="ctl" id="ctlLeft" type="button">
          <span class="c-ico">⬅️</span><span class="c-name" id="ctlLeftName">左移</span>
        </button>
        <button class="ctl" id="ctlJump" type="button">
          <span class="c-ico">⬆️</span><span class="c-name" id="ctlJumpName">跳跃</span>
        </button>
        <button class="ctl" id="ctlSlide" type="button">
          <span class="c-ico">⬇️</span><span class="c-name" id="ctlSlideName">滑铲</span>
        </button>
        <button class="ctl" id="ctlRight" type="button">
          <span class="c-ico">➡️</span><span class="c-name" id="ctlRightName">右移</span>
        </button>
      </div>

      <p class="howto" id="howtoText"></p>
    </div>

    <div class="overlay" id="overlay">
      <div class="card" id="overlayCard"></div>
    </div>

    <script>
    (function(){
      "use strict";
      /* ---------------- i18n: auto-detect + manual switch ---------------- */
      var LANG_KEY = "zlgz_lang";
      function detectLang(){
        try{ var s = localStorage.getItem(LANG_KEY); if(s==="en"||s==="zh") return s; }catch(e){}
        var nav = "";
        try{ nav = (navigator.language || (navigator.languages && navigator.languages[0]) || "zh").toLowerCase(); }catch(e){}
        if(nav.indexOf("en")===0) return "en";
        if(nav.indexOf("zh")===0) return "zh";
        /* non-zh/en systems default to English for overseas players */
        return nav ? "en" : "zh";
      }
      var LANG = detectLang();
      var STR = {
        zh: {
          docTitle:"猪猪勇闯神庙 · 神庙跑酷小游戏",
          alert:"💾 血条已保存在本机浏览器：刷新、关页、返回都不会重置；清除浏览器数据或换设备才会重新开始",
          title:"猪猪勇闯神庙", subtitle:"神庙跑酷 · 15 关闯关 · 每关首通 +10,000 积分 · 100,000 分兑 5 USDT",
          dist:"距离", target:"目标", livesLabel:"❤️ 血条", addLives:"＋ 加血", pointsLabel:"⭐ 积分", claimBtn:"🏆 兑换 USDT",
          levelMapAria:"关卡地图（共 15 关）", stageAria:"神庙跑酷赛道",

      function clearPendingRef(){

      function recordInviteVisit(){
        var ref = null;
        try{ ref = new URLSearchParams(window.location.search).get("ref"); }catch(e){}
        if (!ref || !REF_RE.test(ref) || ref === myInviteCode) return; /* bad format or self-invite: ignore */
        try{ localStorage.setItem(PENDING_REF_KEY, ref); }catch(e){}
        sbRequest("POST", "/pig_invites", {
          inviter_code: ref,
          invitee_device_id: playerId,
          invitee_code: myInviteCode
        }).then(function(r){
          if (r.ok || r.status === 409) setBackendOk(true); /* 409 = unique conflict, already recorded */
          else setBackendOk(false);
        }).catch(function(){ setBackendOk(false); });
      }
      function completePendingInvite(level){
        var ref = null;
        try{ ref = localStorage.getItem(PENDING_REF_KEY); }catch(e){}
        if (!ref || !REF_RE.test(ref)) return;
        if (ref === myInviteCode){ clearPendingRef(); return; }
        var dev = encodeURIComponent(playerId);
        sbRequest("GET", "/pig_invites?invitee_device_id=eq." + dev + "&completed_at=not.is.null&select=inviter_code").then(function(r){
          if (!r.ok){ setBackendOk(false); return; } /* keep pending_ref, retry on next clear */
          setBackendOk(true);
          if (Array.isArray(r.data) && r.data.length > 0){ clearPendingRef(); return; } /* this device already counted once */
          var nowIso = new Date().toISOString();
          var cond = "/pig_invites?inviter_code=eq." + encodeURIComponent(ref) + "&invitee_device_id=eq." + dev;
          sbRequest("PATCH", cond, { level_completed: level, completed_at: nowIso }, "return=representation").then(function(pr){
            if (pr.ok && Array.isArray(pr.data) && pr.data.length > 0){ clearPendingRef(); return; }
            if (!pr.ok){ setBackendOk(false); return; }
            /* no pending row (visit was never recorded): insert a completed one as fallback */
            sbRequest("POST", "/pig_invites", {
              inviter_code: ref,
              invitee_device_id: playerId,
              invitee_code: myInviteCode,
              level_completed: level,
              completed_at: nowIso
            }).then(function(postR){
              if (postR.ok || postR.status === 409) clearPendingRef();
              else setBackendOk(false);
            }).catch(function(){ setBackendOk(false); });
          }).catch(function(){ setBackendOk(false); });
        }).catch(function(){ setBackendOk(false); });

      /* ---------------- temple runner engine ----------------
         Behind-view 3-lane runner on canvas. Objects carry d = metres
         ahead of the pig; each frame d shrinks by speed*dt. Perspective:
         t = 1 - d/VIEW maps distance to screen height and scale. */
      var VIEW = 55;
      var mode = "idle";            /* idle | run | over */
      var paused = false;
      var R = null;                 /* current run state */
      var idleDist = 0;
      var S = { level: 1, started: false, over: false };
      var CW = 0, CH = 0;

      function sizeCanvas(){
        var w = canvas.clientWidth || stageWrap.clientWidth || 320;
        var h = canvas.clientHeight || Math.round(w * 1.1);
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        CW = w; CH = h;
      }
      function horizonY(){ return CH * 0.24; }
      function groundY(){ return CH * 0.90; }
      function persp(d){
        var t = 1 - Math.max(0, Math.min(VIEW, d)) / VIEW;
        var e = Math.pow(t, 2.1);
        return {
          y: horizonY() + (groundY() + CH * 0.10 - horizonY()) * e,
          s: 0.10 + 0.90 * Math.pow(t, 1.7),
          spread: Math.pow(t, 1.35)
        };
      }
      function laneCenterX(lane, spread){
        return CW / 2 + lane * CW * 0.335 * spread;
      }
      function newRun(level){
        var cfg = LEVELS[level];
        return {
          level: level, cfg: cfg,
          dist: 0, speed: cfg.speed, coins: 0,
          lane: 0, laneX: 0,
          jumpY: 0, vy: 0, sliding: 0,
          objs: [], nextSpawnAt: 55, time: 0, dead: false
        };
      }
      function spawnEvent(run){
        var r = Math.random();
        var base = VIEW + 6;
        if (r < 0.30){
          /* a line of coins in one lane */
          var lane = Math.floor(Math.random() * 3) - 1;
          for (var i = 0; i < 5; i++) run.objs.push({ kind: "coin", lane: lane, d: base + i * 3.2, taken: false });
        } else if (r < 0.56){
          run.objs.push({ kind: "block", lane: Math.floor(Math.random() * 3) - 1, d: base, passed: false });
        } else if (r < 0.79){
          run.objs.push({ kind: "barrier", lane: 0, d: base, passed: false });
        } else {
          run.objs.push({ kind: "beam", lane: 0, d: base, passed: false });
        }
        var gap = run.cfg.gapMin + Math.random() * (run.cfg.gapMax - run.cfg.gapMin);
        gap = Math.max(gap, run.speed * 1.05); /* never spawn faster than a player can react */
        run.nextSpawnAt = run.dist + gap;
      }
      function doLeft(){ if (R && mode === "run" && !paused && R.lane > -1){ R.lane--; sndClick(); } }
      function doRight(){ if (R && mode === "run" && !paused && R.lane < 1){ R.lane++; sndClick(); } }
      function doJump(){
        if (R && mode === "run" && !paused && R.jumpY <= 0.001){
          R.vy = 11.5; R.jumpY = 0.01; R.sliding = 0; sndJump();
        }
      }
      function doSlide(){
        if (R && mode === "run" && !paused){
          if (R.jumpY > 0.001){ R.vy = -16; } /* slam down from a jump */
          R.sliding = 0.62; sndClick();
        }
      }
      function crash(){
        if (!R || R.dead) return;
        R.dead = true;
        mode = "over";
        S.over = true;
        sndBad(); buzz([60, 40, 60]);
        stageWrap.classList.remove("shake"); void stageWrap.offsetWidth; stageWrap.classList.add("shake");
        updateHUD();
        setTimeout(showDeath, 650);
      }
      function updateRun(dt){
        var cfg = R.cfg;
        R.time += dt;
        R.speed = Math.min(cfg.speed + 6, cfg.speed + R.dist * 0.0022);
        R.dist += R.speed * dt;
        if (R.dist >= cfg.target){
          R.dist = cfg.target;
          updateHUD();
          onWin();
          return;
        }
        if (R.dist >= R.nextSpawnAt) spawnEvent(R);
        /* player physics */
        if (R.jumpY > 0 || R.vy > 0){
          R.vy -= 30 * dt;
          R.jumpY += R.vy * dt;
          if (R.jumpY <= 0){ R.jumpY = 0; R.vy = 0; }
        }
        if (R.sliding > 0) R.sliding = Math.max(0, R.sliding - dt);
        R.laneX += (R.lane - R.laneX) * Math.min(1, dt * 13);
        if (Math.abs(R.lane - R.laneX) < 0.001) R.laneX = R.lane;
        /* objects */
        for (var i = R.objs.length - 1; i >= 0; i--){
          var o = R.objs[i];
          o.d -= R.speed * dt;
          if (o.d < -3){ R.objs.splice(i, 1); continue; }
          if (o.taken || o.passed) continue;
          if (o.d < 1.3 && o.d > -0.7){
            if (o.kind === "coin"){
              if (R.lane === o.lane && R.jumpY < 1.3){
                o.taken = true; R.coins++; sndCoin(); updateHUD();
              }
            } else if (o.kind === "block"){
              if (R.lane === o.lane){ crash(); return; }
              o.passed = true;
            } else if (o.kind === "barrier"){
              if (R.jumpY < 0.5){ crash(); return; }
              o.passed = true;
            } else if (o.kind === "beam"){
              if (R.sliding <= 0){ crash(); return; }
              o.passed = true;
            }
          }
        }
        updateHUD();
      }
      var lastHudDist = -1, lastHudCoins = -1, lastHudLevel = 0;
      function updateHUD(){
        var dist = R ? Math.floor(R.dist) : 0;
        var coins = R ? R.coins : 0;
        var lv = R ? R.level : (S ? S.level : 1);
        if (dist === lastHudDist && coins === lastHudCoins && lv === lastHudLevel) return;
        lastHudDist = dist; lastHudCoins = coins; lastHudLevel = lv;
        var sd = document.getElementById("statDist"); if (sd) sd.textContent = L().meter(fmtNum(dist));
        var sc = document.getElementById("statCoins"); if (sc) sc.textContent = coins;

      /* ---------------- drawing ---------------- */
      function drawEmoji(txt, x, y, size){
        ctx.font = size + "px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(txt, x, y);
      }
      function drawScene(now){
        if (!CW) sizeCanvas();
        var W = CW, H = CH, hy = horizonY(), gy = groundY();
        var scrollDist = (mode === "run" && R) ? R.dist : idleDist;
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        /* sky */
        var sky = ctx.createLinearGradient(0, 0, 0, hy * 1.6);
        if (dark){ sky.addColorStop(0, "#20343f"); sky.addColorStop(1, "#3d5a43"); }
        else { sky.addColorStop(0, "#a5dcf5"); sky.addColorStop(1, "#dff3d8"); }
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hy + 2);
        /* distant temple pyramid at the horizon */
        ctx.fillStyle = dark ? "#4a4232" : "#b3a071";
        var tw = W * 0.30, th = hy * 0.78, tx = W / 2 - tw / 2, ty = hy - th;
        ctx.beginPath();
        ctx.moveTo(tx, hy); ctx.lineTo(tx + tw * 0.18, ty + th * 0.34); ctx.lineTo(tx + tw * 0.34, ty + th * 0.34);
        ctx.lineTo(tx + tw * 0.40, ty); ctx.lineTo(tx + tw * 0.60, ty); ctx.lineTo(tx + tw * 0.66, ty + th * 0.34);
        ctx.lineTo(tx + tw * 0.82, ty + th * 0.34); ctx.lineTo(tx + tw, hy); ctx.closePath(); ctx.fill();
        ctx.fillStyle = dark ? "#5d5340" : "#c9b586";
        ctx.fillRect(tx + tw * 0.44, ty + th * 0.30, tw * 0.12, th * 0.30);
        /* jungle sides */
        ctx.fillStyle = dark ? "#1d3a24" : "#3f7d34";
        ctx.fillRect(0, hy, W * 0.10, H - hy);
        ctx.fillRect(W * 0.90, hy, W * 0.10, H - hy);
        ctx.fillStyle = dark ? "#26502f" : "#57a047";
        for (var sIdx = 0; sIdx < 6; sIdx++){
          var ty2 = hy + (H - hy) * (sIdx / 6) + ((scrollDist * 14) % ((H - hy) / 6));
          if (ty2 > H) ty2 -= (H - hy);
          var tr = 8 + (ty2 - hy) / (H - hy) * 20;
          ctx.beginPath(); ctx.arc(W * 0.05, ty2, tr, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(W * 0.95, ty2 + 12, tr * 0.85, 0, 7); ctx.fill();
        }
        /* stone track trapezoid */
        var topHalf = W * 0.075, botHalf = W * 0.46;
        ctx.fillStyle = dark ? "#6b5f45" : "#c9b586";
        ctx.beginPath();
        ctx.moveTo(W / 2 - topHalf, hy); ctx.lineTo(W / 2 + topHalf, hy);
        ctx.lineTo(W / 2 + botHalf, H); ctx.lineTo(W / 2 - botHalf, H);
        ctx.closePath(); ctx.fill();
        /* moving slab lines for speed sensation */
        ctx.strokeStyle = dark ? "rgba(0,0,0,.28)" : "rgba(93,81,56,.35)";
        ctx.lineWidth = 2;
        var slabGap = 6, off = scrollDist % slabGap;
        for (var k = 0; k < 11; k++){
          var dd = k * slabGap - off + slabGap;
          if (dd <= 0.4) continue;
          var pp = persp(dd);
          var half = (W * 0.075) + (botHalf - W * 0.075) * pp.spread;
          ctx.beginPath(); ctx.moveTo(W / 2 - half, pp.y); ctx.lineTo(W / 2 + half, pp.y); ctx.stroke();
        }
        /* lane divider lines */
        ctx.strokeStyle = dark ? "rgba(255,240,200,.30)" : "rgba(255,252,235,.55)";
        ctx.lineWidth = 2.5;
        [-0.5, 0.5].forEach(function(lb){
          ctx.beginPath();
          ctx.moveTo(W / 2 + lb * W * 0.15, hy);
          ctx.lineTo(W / 2 + lb * W * 0.67, H);
          ctx.stroke();
        });
        /* finish banner near target */
        if (mode === "run" && R){
          var remain = R.cfg.target - R.dist;
          if (remain < VIEW){
            var fp = persp(Math.max(remain, 0.5));
            ctx.fillStyle = "#e8a812";
            var fw = W * 0.67 * fp.spread + 20 * fp.s;
            ctx.fillRect(W / 2 - fw / 2, fp.y - 64 * fp.s, fw, 13 * fp.s + 3);
            drawEmoji("🏁", W / 2, fp.y - 58 * fp.s, 22 * fp.s + 6);
          }
        }
        /* objects, far to near */
        if (R && (mode === "run" || mode === "over")){
          var sorted = R.objs.slice().sort(function(a, b){ return b.d - a.d; });
          sorted.forEach(function(o){
            if (o.taken || o.d > VIEW) return;
            var p = persp(Math.max(o.d, 0));
            var x = laneCenterX(o.lane, p.spread);
            if (o.kind === "coin"){
              var bob = Math.sin(now / 260 + o.d) * 3 * p.s;
              drawEmoji("🪙", x, p.y - 20 * p.s + bob, 30 * p.s + 6);
            } else if (o.kind === "block"){
              drawEmoji("🗿", x, p.y - 34 * p.s, 74 * p.s + 8);
            } else if (o.kind === "barrier"){
              var bw = W * 0.67 * p.spread + 26 * p.s;
              ctx.fillStyle = "#8a5a2e";
              ctx.fillRect(W / 2 - bw / 2, p.y - 20 * p.s, bw, 13 * p.s + 3);
              ctx.fillStyle = "#a4713d";
              ctx.fillRect(W / 2 - bw / 2, p.y - 20 * p.s, bw, 4 * p.s + 1);
              drawEmoji("🪵", W / 2 - bw * 0.28, p.y - 13 * p.s, 24 * p.s + 5);
              drawEmoji("🪵", W / 2 + bw * 0.28, p.y - 13 * p.s, 24 * p.s + 5);
            } else if (o.kind === "beam"){
              var ew = W * 0.67 * p.spread + 26 * p.s;
              var beamTop = p.y - 96 * p.s;
              ctx.fillStyle = dark ? "#57492f" : "#8a7c5c";
              ctx.fillRect(W / 2 - ew / 2, beamTop, ew, 18 * p.s + 4);
              ctx.fillStyle = "rgba(0,0,0,.18)";
              ctx.fillRect(W / 2 - ew / 2, beamTop + (18 * p.s + 4) - 4, ew, 4);
              drawEmoji("🌿", W / 2 - ew * 0.32, beamTop + 22 * p.s, 22 * p.s + 5);
              drawEmoji("🌿", W / 2 + ew * 0.32, beamTop + 22 * p.s, 22 * p.s + 5);
              /* posts */
              ctx.fillStyle = dark ? "#463b26" : "#6d5c33";
              ctx.fillRect(W / 2 - ew / 2, beamTop, 7 * p.s + 2, 96 * p.s);
              ctx.fillRect(W / 2 + ew / 2 - (7 * p.s + 2), beamTop, 7 * p.s + 2, 96 * p.s);
            }
          });
        }
        /* pig player */
        var runDist = (mode === "run" && R) ? R.dist : idleDist;
        var laneX = R ? R.laneX : Math.sin(now / 2400) * 0.7;
        var jumpY = R ? R.jumpY : 0;
        var sliding = R ? R.sliding : 0;
        var px = laneCenterX(laneX, 1);
        var bobY = (jumpY <= 0 && sliding <= 0) ? Math.abs(Math.sin(now / 95 + runDist)) * 3.2 : 0;
        var py = gy - jumpY * H * 0.17 - bobY;
        /* shadow */
        ctx.fillStyle = "rgba(0,0,0,.25)";
        ctx.beginPath();
        ctx.ellipse(px, gy + 8, 30 - jumpY * 5, 7, 0, 0, 7);
        ctx.fill();
        ctx.save();
        ctx.translate(px, py - 26);
        if (R) ctx.rotate((R.lane - R.laneX) * -0.28);
        if (R && R.dead) ctx.rotate(0.5);
        if (sliding > 0) ctx.scale(1.12, 0.55);
        drawEmoji("🐷", 0, sliding > 0 ? 12 : 0, 62);
        ctx.restore();
        /* paused veil */
        if (paused && mode === "run"){
          ctx.fillStyle = "rgba(20,16,6,.45)";
          ctx.fillRect(0, 0, W, H);
          drawEmoji("⏸", W / 2, H / 2 - 16, 54);
          ctx.fillStyle = "#fff";
          ctx.font = "700 16px 'PingFang SC',sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(isEn() ? "Paused" : "已暂停", W / 2, H / 2 + 26);
        }

        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24){

          '👉 <b>跑酷玩法</b>：小猪自动往前跑，你负责操控——<b>左右滑动</b>（或点按钮 / 按方向键）换道躲开<b>石像 🗿</b>，<b>上滑跳跃</b>跳过倒木 🪵，<b>下滑滑铲</b>钻过石梁；撞上障碍本局结束，跑满<b>目标距离</b>就过关<br/>' +
          '⭐ <b>积分奖励</b>：共 <b>15 关</b>，每关第一次通关 <b>+10,000 积分</b>（重复通关不重复计分），<b>100,000 积分找运营方兑换 5 USDT</b><br/>' +
          '❤️ 每人免费 <b>3 格血条</b>，每开一局扣 1 格，扣完就锁定，不能再开局（通关也不返血哦）<br/>' +
          '<span id="gateInviteRule">👥 <b>邀请好友自动加血</b>：把带你邀请码的链接发给好友，好友打开并<b>过完 1 关</b>，你下次打开游戏<b>自动 +1 格血</b>（上限 10 格），不用找运营方、不用兑换码</span><br/>' +
          '🟡 <b>币安注册认证回满</b>：用下方币安邀请链接注册并完成<b>实名认证</b>，联系运营方手动核实，领一次性兑换码，输入后血条直接<b>回满 10 格</b><br/>' +
          '💾 血条保存在本机浏览器：刷新、关页、返回都不会重置；用过的兑换码会一直记为已用' +
          '</div>' +
          '<p class="lock-note" id="gateLockNote">❌ 血条已空，先用下面任一方式加血，加完就能继续开局</p>' +
          '<button class="btn" id="gStartNext">开始闯关</button>' +
          (gateCanClose ? '<button class="btn secondary" id="gClose">← 回到当前对局</button>' : '<button class="btn secondary" id="gClose">先看看关卡地图（任选一关）</button>') +
          '<div class="panel">' +
            '<div class="panel-title">🏆 积分兑换 USDT（100,000 分 = 5 USDT）</div>' +
            '<p id="gatePoints"></p>' +
            '<button class="btn sm bn-btn" id="gClaimOpen">领取 USDT / 查看领取办法</button>' +
            '<p class="panel-note">领取方式：把游戏 ID + 币安 UID 发给运营方人工核对——确认你是用邀请码 <b>VIP700</b> 注册币安、完成实名认证的玩家（完成过一笔交易更好），核对通过后运营方按 100,000 积分 = 5 USDT 发放。积分只认本页记录的通关进度，截图无效。</p>' +
          '</div>' +
          '<div class="panel"><div id="invitePanelBody"></div></div>' +
          '<div class="panel">' +
            '<div class="panel-title">🟡 币安任务链（注册 → 认证 → 交易）</div>' +
            '<ol class="task-steps">' +
            '<li><b>注册币安</b>：点下方按钮用邀请链接注册（邀请码 VIP700）</li>' +
            '<li><b>实名认证</b>：在币安 App 里完成 KYC 身份认证——领积分兑换和回血都要先过这一步</li>' +
            '<li><b>完成一笔交易</b>：现货买一笔就行（金额不限，建议 ≥10 USDT），兑换积分时运营方会优先核对</li>' +
            '</ol>' +
            '<p>邀请链接：<span class="link-text">' + BN_URL + '</span><br/>邀请码：<b>VIP700</b></p>' +
            '<a class="btn sm bn-btn" href="' + BN_URL + '" target="_blank" rel="noopener">去币安注册 →</a>' +
            '<button class="btn secondary sm" id="gRedeemOpen">我已完成注册 + 认证，输入兑换码</button>' +
            '<p class="panel-note">注册成功并完成实名认证后，联系运营方核实；核实通过会发你一次性兑换码，回来输入即可回满。</p>' +
          '</div>';
        showOverlay(html);
        updateLivesUI();
        updatePointsUI();
        document.getElementById("gStartNext").addEventListener("click", function(){ tryStart(nextLevel()); });
        document.getElementById("gClaimOpen").addEventListener("click", function(){ showClaim(); });
        var gc = document.getElementById("gClose");
        if (gc) gc.addEventListener("click", function(){ hideOverlay(); if (gateCanClose && mode === "run" && paused) togglePause(); });
        renderInvitePanel();
        document.getElementById("gRedeemOpen").addEventListener("click", function(){ showRedeem(); });
      }
      function showClaim(){
        if (isEn()){ showClaimEN(); return; }
        var cb = claimableBlocks();
        var html =
          '<div class="big-emoji">🏆</div><h2>积分兑换 USDT</h2>' +
          '<p>兑换标准：<b>100,000 积分 = 5 USDT</b>。每关第一次通关 +10,000 积分，15 关全通共 150,000 分。</p>' +
          '<div class="win-points" id="claimPoints">' + pointsSummaryHTML() + '</div>' +
          '<p style="text-align:left"><b>领取步骤（人工核实）：</b><br/>' +
          '1️⃣ 先用邀请码 <b>VIP700</b> 注册币安并完成<b>实名认证</b>，最好再完成一笔交易（领积分的前提，没注册认证领不了）；<br/>' +
          '2️⃣ 在下面填你的币安 UID，点「复制领取信息」发给运营方；<br/>' +
          '3️⃣ 运营方在币安后台核对 UID 的注册、认证（及交易）情况，确认积分达标后把 USDT 发给你；<br/>' +
          '4️⃣ 收到 USDT 后，回来点「我已收到，标记已领取」，免得下次重复计算。</p>' +
          '<div class="redeem-box">' +
            '<p>你的游戏 ID：<span class="code-chip">' + playerId + '</span></p>' +
            '<input class="txt-input" id="claimUid" placeholder="输入你的币安 UID（在币安 App 里可查）" autocomplete="off" />' +
            '<button class="btn sm bn-btn" id="cCopy">📋 复制领取信息发给运营方</button>' +
            (cb > 0
              ? '<button class="btn secondary sm" id="cMark">我已收到 ' + (cb * USDT_PER_BLOCK) + ' USDT，标记已领取</button>'
              : '<p class="panel-note">还没攒够 100,000 分，先继续闯关吧——过 10 关就能领第一次。</p>') +
          '</div>' +
          '<p class="msg" id="claimMsg"></p>' +
          '<div class="safe-tip">✅ 安全提示：核实全程只需提供游戏 ID 和币安 UID，不要把密码、短信验证码发给任何人。<br/>💾 积分保存在本机浏览器：刷新、关页不会清零；清除浏览器数据或换设备会重新开始，所以达标后尽快领取。</div>' +
          '<a class="btn sm bn-btn" href="' + BN_URL + '" target="_blank" rel="noopener">还没注册？去币安注册（邀请码 VIP700）→</a>' +
          '<button class="btn secondary" id="cBack">← 返回</button>';
        showOverlay(html);
        document.getElementById("cCopy").addEventListener("click", function(){
          var uid = (document.getElementById("claimUid").value || "").trim();
          var lvList = clearedLevels.slice().sort(function(a,b){return a-b;}).join("、") || "无";
          copyText("你好，我要领取《猪猪勇闯神庙》积分兑换 USDT。游戏 ID：" + playerId + "，币安 UID：" + (uid || "（还没填）") + "，已通关关卡：" + lvList + "，总积分：" + fmtNum(pointsTotal()) + "，可兑换：" + (claimableBlocks() * USDT_PER_BLOCK) + " USDT（100,000 分 = 5 USDT）。我已用邀请码 VIP700 注册币安并完成实名认证，请核实发放。");
          setMsg("claimMsg", "领取信息已复制，去发给运营方吧！", true);
        });
        var cm = document.getElementById("cMark");
        if (cm) cm.addEventListener("click", function(){
          claimedBlocks += claimableBlocks();
          saveState();
          updatePointsUI();
          sndWin();
          showClaim();
          setMsg("claimMsg", "✅ 已标记领取，积分余额继续累积，攒够下一个 100,000 分还能再领 5 USDT。", true);
        });
        document.getElementById("cBack").addEventListener("click", function(){ showGate(); });
      }
      function showRedeem(){
        if (isEn()){ showRedeemEN(); return; }
        var html =
          '<div class="big-emoji">🎁</div><h2>兑换码加血</h2>' +
          '<p><b>第 1 步 · 提交核实：</b>把你的游戏 ID 和币安 UID 发给运营方，运营方会核对你是否用邀请码 <b>VIP700</b> 注册并完成实名认证。</p>' +
          '<div class="redeem-box">' +
            '<p>你的游戏 ID：<span class="code-chip">' + playerId + '</span></p>' +
            '<input class="txt-input" id="uidInput" placeholder="输入你的币安 UID（在币安 App 里可查）" autocomplete="off" />' +
            '<button class="btn sm" id="rCopy">📋 复制核实信息发给运营方</button>' +
          '</div>' +
          '<p><b>第 2 步 · 输入兑换码：</b>运营方核实通过后会发你一次性兑换码（PIGR- 开头），输入下面就能把血条直接回满到 10 格。码只能用一次，用过会一直记为已用，自己随便编的码无效。</p>' +
          '<div class="input-row"><input class="txt-input" id="redeemCode" placeholder="输入运营方发的兑换码，如 PIGR-XXXXXXXXXX" autocomplete="off" /><button class="mini-btn" id="rRedeem" type="button">兑换</button></div>' +
          '<p class="msg" id="redeemMsg"></p>' +
          '<div class="safe-tip">✅ 安全提示：核实全程只需提供游戏 ID 和币安 UID，不要把密码、短信验证码发给任何人。<br/>💾 血条和已用过的兑换码保存在本机浏览器，刷新、关页、返回都不会重置；清除浏览器数据或换设备才会清零。</div>' +
          '<button class="btn secondary" id="rBack">← 返回</button>';
        showOverlay(html);
        document.getElementById("rCopy").addEventListener("click", function(){
          var uid = (document.getElementById("uidInput").value || "").trim();
          copyText("你好，我已用邀请码 VIP700 完成币安注册 + 实名认证，请核实加血。我的游戏 ID：" + playerId + "，币安 UID：" + (uid || "（还没填）"));
          setMsg("redeemMsg", "核实信息已复制，去发给运营方吧！", true);
        });
        document.getElementById("rRedeem").addEventListener("click", redeemByCode);
        document.getElementById("rBack").addEventListener("click", function(){ showGate(); });
      }
      function tryStart(level){
        if (lives <= 0){ mode = "idle"; showGate(false); return; }
        lives--;
        saveState();
        hideOverlay();
        startLevel(level);
        updateLivesUI();
      }
      function startLevel(level){
        S = { level: level, started: true, over: false };
        R = newRun(level);
        mode = "run";
        paused = false;
        document.getElementById("btnPause").textContent = "⏸";
        forceHUD();
        updatePointsUI();
        toast(L().startToast(levelName(level), fmtNum(LEVELS[level].target), lives));
      }
      /* level map: 15 buttons */
      (function buildLevelMap(){
        var map = document.getElementById("levelMap");
        for (var lv=1; lv<=TOTAL_LEVELS; lv++){
          (function(n){
            var b = document.createElement("button");
            b.type = "button"; b.className = "lv-btn";
            b.setAttribute("aria-label", L().levelAria(n));
            var num = document.createElement("span"); num.className = "lv-n"; num.textContent = n;
            var sub = document.createElement("span"); sub.className = "lv-s"; sub.textContent = "";
            b.appendChild(num); b.appendChild(sub);
            b.addEventListener("click", function(){ tryStart(n); });
            map.appendChild(b);
          })(lv);
        }
      })();
      document.getElementById("btnAddLives").addEventListener("click", function(){
        var inRun = (mode === "run" && R && !S.over);
        if (inRun && !paused) togglePause();
        showGate(!!inRun);
      });
      document.getElementById("btnClaim").addEventListener("click", function(){ showClaim(); });
      window.addEventListener("resize", function(){ sizeCanvas(); });

      /* ---------------- language switching ---------------- */
      function applyI18n(){
        var s = L();
        try{ document.documentElement.lang = isEn() ? "en" : "zh-CN"; }catch(e){}
        document.title = s.docTitle;
        function setText(id, txt){ var el = document.getElementById(id); if (el) el.textContent = txt; }
        function setHTML(id, html){ var el = document.getElementById(id); if (el) el.innerHTML = html; }
        setText("alertBar", s.alert);
        setText("mainTitle", s.title);
        setText("mainSubtitle", s.subtitle);
        setText("labelDist", s.dist);
        setText("labelTarget", s.target);
        setText("labelLives", s.livesLabel);
        setText("btnAddLives", s.addLives);
        setText("labelPoints", s.pointsLabel);
        setText("btnClaim", s.claimBtn);
        setText("ctlLeftName", s.ctlLeft);
        setText("ctlJumpName", s.ctlJump);
        setText("ctlSlideName", s.ctlSlide);
        setText("ctlRightName", s.ctlRight);
        setHTML("ctrlTip", s.ctrlTip);
        setHTML("howtoText", s.howto);
        var lm = document.getElementById("levelMap"); if (lm) lm.setAttribute("aria-label", s.levelMapAria);
        if (canvas) canvas.setAttribute("aria-label", s.stageAria);
        var zhBtn = document.getElementById("langZh"); if (zhBtn) zhBtn.classList.toggle("active", !isEn());
        var enBtn = document.getElementById("langEn"); if (enBtn) enBtn.classList.toggle("active", isEn());
        if (lm){
          for (var i=0;i<lm.children.length;i++) lm.children[i].setAttribute("aria-label", s.levelAria(i+1));
        }
        forceHUD();
        updatePointsUI();
        updateLivesUI();
      }
      function setLang(next){
        if (next !== "en" && next !== "zh") return;
        if (next === LANG){ applyI18n(); return; }
        LANG = next;
        try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
        var overlayWasOpen = overlay && overlay.classList.contains("show");
        var wasClaim = overlayWasOpen && !!document.getElementById("claimUid");
        var wasRedeem = overlayWasOpen && !!document.getElementById("redeemCode");
        var wasGate = overlayWasOpen && !!document.getElementById("gStartNext");
        var wasWin = overlayWasOpen && !!document.getElementById("ovReplay");
        var wasDeath = overlayWasOpen && !!document.getElementById("ovRetry");
        applyI18n();
        if (overlayWasOpen && !wasWin){
          if (wasClaim) showClaim();
          else if (wasRedeem) showRedeem();
          else if (wasDeath) showDeath();
          else if (wasGate) showGate();
        } else if (overlayWasOpen && wasWin){
          /* win overlay keeps its banked state; rebuild it in the new language */
          onWinRebuild();
        }
      }
      function onWinRebuild(){
        /* rebuild win overlay without re-banking points or re-firing invite completion */
        var cb = claimableBlocks();
        var isFinal = S.level >= TOTAL_LEVELS;
        var allDone = clearedLevels.length >= TOTAL_LEVELS;
        var pointsHtml = '<div class="win-points">' + pointsSummaryHTML() + '</div>';
        var html =
          '<div class="big-emoji">' + (isFinal ? '👑🐷👑' : '🐷🏆') + '</div>' +
          '<h2>' + (isFinal ? L().winTitleFinal : L().winTitle(S.level)) + '</h2>' +
          '<p>' + (allDone ? L().winDescAll : (isFinal ? L().winDescFinal : L().winDescNormal)) + '</p>' +
          pointsHtml +
          (cb > 0 ? '<button class="btn bn-btn" id="ovClaim">' + L().winClaim(cb * USDT_PER_BLOCK) + '</button>' : '') +
          (!isFinal ? '<button class="btn" id="ovNext">' + L().winNext(S.level+1) + '</button>' : '') +
          '<button class="btn secondary" id="ovReplay">' + L().winReplay(S.level) + '</button>' +
          (isFinal ? '<button class="btn secondary" id="ovBack1">' + L().winBack1 + '</button>' : '');
        showOverlay(html);
        var oc = document.getElementById("ovClaim");
        if (oc) oc.addEventListener("click", function(){ showClaim(); });
        var on = document.getElementById("ovNext");
        if (on) on.addEventListener("click", function(){ tryStart(S.level+1); });
        document.getElementById("ovReplay").addEventListener("click", function(){ tryStart(S.level); });
        var ob = document.getElementById("ovBack1");
        if (ob) ob.addEventListener("click", function(){ tryStart(1); });
      }

      (function wireLangToggle(){
        var zb = document.getElementById("langZh"); if (zb) zb.addEventListener("click", function(){ setLang("zh"); });
        var eb = document.getElementById("langEn"); if (eb) eb.addEventListener("click", function(){ setLang("en"); });
      })();
      applyI18n();
      sizeCanvas();
      forceHUD();
      updatePointsUI();
      showGate(false);
      requestAnimationFrame(frame);
      recordInviteVisit();   /* opened via ?ref= link: record the pending invite */
      claimInviteCredits();  /* redeem friends' completed invites for +1 life each */
    })();
    </script>
  </body>
</html>
